<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudos da Ingryd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* =====================================================================
   PERSONALIZE O VISUAL AQUI
   ---------------------------------------------------------------------
   Cada linha é uma "variável" de design. Troque o valor depois dos
   dois-pontos e salve: o site inteiro muda junto.
   Paleta base:  Ivory Mist #F7F2E0 · Night Bordeaux #5B0015 · Cool Horizon #80AEE8
   O site usa sempre estas cores, mesmo com o aparelho no modo escuro.
   ===================================================================== */
:root{
  --bg:#F7F2E0;          /* fundo da página (marfim) */
  --grid:rgba(91,0,21,.055); /* linhas do quadriculado do fundo (use transparent para tirar) */
  --surface:#FFFCF2;     /* fundo das listas e cartões */
  --surface-2:#EFE6CC;   /* fundo de destaque leve */
  --ink:#3B0811;         /* texto principal */
  --head:#5B0015;        /* cor dos títulos (bordô) */
  --muted:#8A6870;       /* texto secundário */
  --line:#E5D8BC;        /* bordas e divisórias */
  --accent:#5B0015;      /* COR PRINCIPAL: botões e destaques (bordô) */
  --accent-ink:#F7F2E0;  /* texto em cima da cor principal */
  --sky:#80AEE8;         /* azul da paleta */
  --sky-soft:#DDE9F8;    /* azul clarinho */
  --sky-ink:#5B0015;     /* texto em cima do azul */
  --topo:#5B0015;        /* fundo da barra do topo */
  --topo-ink:#F7F2E0;    /* texto da barra do topo */

  /* cores de desempenho */
  --ok:#2C7350; --ok-bg:#DCEEDD; --warn:#9A5B00; --warn-bg:#F5E2BE; --bad:#B3263A; --bad-bg:#F7D6DA; --top:#2F5FA8; --top-bg:#DDE9F8;

  /* paleta das disciplinas (c1 a c8) */
  --c1:#80AEE8; --c2:#5B0015; --c3:#C24D5F; --c4:#EDB9C2; --c5:#3D6AAE; --c6:#D9A441; --c7:#7B8B58; --c8:#B8A27F;

  /* FONTES: títulos e texto. Para trocar, escolha outra em fonts.google.com
     e atualize também o <link> de fontes no topo do arquivo. */
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"DM Sans", "Segoe UI", system-ui, sans-serif;

  --r:22px;              /* arredondamento dos cantos */
  --largura:900px;       /* largura máxima do conteúdo */
}
/* O site fica sempre no tema claro (marfim), mesmo com o aparelho no modo escuro. */
/* ===================== fim da área de personalização ===================== */

:root{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;font-weight:700}

/* topo bordô com borda ondulada */
header.top{position:sticky;top:0;z-index:5;background:var(--topo);color:var(--topo-ink);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;pointer-events:none;
  background:radial-gradient(circle at 11px 0,var(--topo) 10px,transparent 10.5px) repeat-x;background-size:22px 10px}
.top-in{max-width:var(--largura);margin:0 auto;display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;display:flex;align-items:center;gap:10px;margin-right:auto;line-height:1}
.brand svg{width:26px;height:26px;flex:none}
nav.tabs{display:flex;gap:4px;align-items:center}
nav.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;color:var(--topo-ink);opacity:.8;font-weight:700}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-current="true"]{background:var(--sky);color:var(--sky-ink);opacity:1}
nav.tabs .btn.ghost{color:var(--topo-ink)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:34px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
#app{max-width:var(--largura);margin:0 auto;display:flex;flex-direction:column;gap:30px}

h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;color:var(--head);letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5.5vw,2.7rem);line-height:1.08}
h2{font-size:1.45rem;line-height:1.15}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2::before{content:"✦";color:var(--sky);margin-right:.4em;font-size:.8em;vertical-align:.08em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--head);background:transparent;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.92rem;text-decoration:none;color:var(--head)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary::after{content:"→";font-weight:400}
.btn.primary:hover{filter:brightness(1.15);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.ghost{border-color:transparent}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 13px;font-size:.84rem}
.btn.sm.primary::after{content:none}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
button.item:hover{background:var(--surface-2)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere;color:var(--ink)}
.item .s{font-size:.86rem;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.glyph{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);flex:none;font-size:1rem}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.chip.none,.chip.futuro,.chip.novo{background:var(--surface-2);color:var(--muted)}
.chip.bad,.chip.atrasada{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--ok-bg);color:var(--ok)}
.chip.top{background:var(--top-bg);color:var(--top)}
.chip.hoje{background:var(--sky);color:var(--sky-ink)}

.empty{border:1.5px dashed var(--line);background:var(--surface);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.empty b{color:var(--head);font-family:var(--f-display);font-weight:400;font-size:1.15rem}

/* herói da página Hoje */
.hero{background:var(--sky);color:var(--sky-ink);border-radius:30px;padding:30px clamp(22px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero h1{color:var(--sky-ink)}
.hero .eyebrow{color:var(--sky-ink);opacity:.75}
.hero .flor{width:clamp(90px,18vw,150px);height:auto}
.hero .spark{position:absolute;font-size:1.4rem;color:var(--sky-ink)}
.sum{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-end;margin-top:18px}
.sum .lbl{font-size:.88rem;font-weight:700}
.big{font-family:var(--f-display);font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;color:var(--head)}
.hero .big{color:var(--sky-ink)}
@media (max-width:520px){.hero{grid-template-columns:1fr;padding-top:26px}.hero>div{padding-right:70px}.hero .flor{position:absolute;right:-22px;top:-22px;width:105px}.hero .spark{display:none}.sum{gap:22px;flex-wrap:nowrap}}

.prof-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.prof-row:first-child{border-top:0}
.prof-row .n{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
.prof-row .n span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px}

/* vitrine de disciplinas */
.grid-disc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.disc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:12px;text-align:left}
.disc:hover{transform:translateY(-2px)}
.disc .capa{border-radius:16px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;font-family:var(--f-display);font-size:2.6rem}
.disc .capa .pend{position:absolute;top:10px;right:10px;background:var(--surface);color:var(--head);font-family:var(--f-body);font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px}
.disc .capa svg{position:absolute;left:12px;bottom:12px;width:26px;height:26px;opacity:.9}
.disc .info{padding:0 6px 6px;display:flex;flex-direction:column;gap:10px}
.disc .nm{font-family:var(--f-display);font-size:1.12rem;line-height:1.2;overflow-wrap:anywhere;color:var(--head)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.stats b{color:var(--ink)}

.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.crumb button{background:none;border:0;padding:0;color:var(--head);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.title-row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.title-row>div:first-child{min-width:0;flex:1}

.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.kv{display:flex;gap:24px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv .v{font-weight:700;color:var(--head)}
.hist{display:flex;align-items:flex-end;gap:4px;height:46px}
.hist span{width:12px;border-radius:6px 6px 2px 2px}
@media (max-width:560px){.rev{grid-template-columns:1fr}}

.search{width:100%;padding:13px 20px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.snip{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.quiz{display:flex;flex-direction:column;gap:18px}
.qbar{display:flex;align-items:center;gap:12px}
.qbar .meter{flex:1}
.enun{font-size:1.1rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);width:100%}
.alt:hover:not(:disabled){border-color:var(--head)}
.alt:disabled{cursor:default}
.alt .L{font-family:var(--f-display);width:30px;height:30px;border-radius:50%;background:var(--sky-soft);color:var(--head);display:grid;place-items:center;flex:none}
.alt .x{padding-top:3px;overflow-wrap:anywhere;min-width:0}
.alt.certa{border-color:var(--ok);background:var(--ok-bg)}
.alt.certa .L{background:var(--ok);color:#fff}
.alt.errada{border-color:var(--bad);background:var(--bad-bg)}
.alt.errada .L{background:var(--bad);color:#fff}
.feedback{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg)} .feedback.no{background:var(--bad-bg)}
.feedback b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.feedback.ok b{color:var(--ok)} .feedback.no b{color:var(--bad)}
.result{background:var(--sky);color:var(--sky-ink);border-radius:30px;padding:30px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.result .big,.result .eyebrow{color:var(--sky-ink)}
.result .btn{border-color:var(--sky-ink);color:var(--sky-ink)}
.result .btn.primary{background:var(--sky-ink);color:#F7F2E0}

/* flashcard que vira */
.cartao{display:grid;border:0;padding:0;background:none;width:100%;min-height:clamp(240px,42vh,360px);perspective:1400px;text-align:left}
.cartao .face{grid-area:1/1;border-radius:28px;padding:28px clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:14px;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative}
.cartao .frente{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.cartao .frente::after{content:"✦";position:absolute;top:20px;right:24px;color:var(--sky);font-size:1.3rem}
.cartao .verso{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg)}
.cartao .verso .eyebrow{color:var(--sky)}
.cartao .txt{font-family:var(--f-display);font-size:clamp(1.25rem,3.4vw,1.6rem);line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.cartao .verso .txt{font-family:var(--f-body);font-size:clamp(1.05rem,2.8vw,1.25rem);line-height:1.55}
.cartao .dica{font-size:.84rem;color:var(--muted);font-weight:700}
.cartao .face{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.cartao.virado .frente{transform:rotateY(-180deg)}
.cartao.virado .verso{transform:rotateY(0)}
@media (prefers-reduced-motion:reduce){.cartao .face{transition:none}}
.rate2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rate2 .btn{min-width:150px;padding:13px 22px;font-size:1rem}
.rate2 .btn.primary::after{content:none}

.auth{max-width:440px;margin:5vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:30px;display:flex;flex-direction:column;gap:16px}
.auth .flor{width:46px;height:46px}

#modal{position:fixed;inset:0;z-index:20;background:rgba(40,2,10,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:28px;padding-bottom:24px}}
.sheet.full{max-width:980px;height:92%;max-height:none}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-weight:700;font-size:.9rem}
.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.fld textarea{resize:vertical;min-height:90px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{width:36px;height:36px;border-radius:50%;cursor:pointer;position:relative;border:1px solid var(--line)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){outline:3px solid var(--head);outline-offset:2px}
.swatches label:has(input:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.altin{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.altin .rad{display:flex;align-items:center;gap:6px;font-family:var(--f-display)}
.hint{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem;font-weight:700}
.okmsg{color:var(--ok);font-size:.9rem;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rate button{padding:16px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.rate button b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--head)}
.rate button:hover{border-color:var(--head)}
.viewer{flex:1;overflow:auto;background:var(--surface-2);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:0}
.viewer.drive{padding:0;overflow:hidden}
.viewer.drive iframe{border:0;width:100%;height:100%;flex:1;background:#fff;border-radius:18px}
.passos{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.viewer canvas,.viewer img{max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:18px;padding:16px 18px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--head);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.loading{color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:no-preference){.alt,.btn,.disc{transition:border-color .15s,background .15s,transform .15s}}
</style>
</head>

const LET='ABCDE';

/* ---------- datas e texto ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDias=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MES[d.getMonth()]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=(n,a,b)=>n+' '+(n===1?a:b);
const iniciais=n=>(n||'?').split(/\s+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase()||(n||'?')[0];
const mb=b=>(b/1048576).toFixed(1)+' MB';

/* ---------- revisão espaçada ---------- */
function proximoIntervalo(prev,nota){let iv;
  if(nota<.5)iv=1;
  else if(nota<.7)iv=prev?Math.max(2,Math.round(prev*1.2)):3;
  else if(nota<.85)iv=prev?Math.max(4,Math.round(prev*2)):7;
  else iv=prev?Math.max(7,Math.round(prev*2.6)):10;
  return Math.min(iv,120)}
function prof(a){const h=a.revisao?.historico||[];if(!h.length)return null;const w=[3,2,1];let s=0,t=0;h.slice(-3).reverse().forEach((x,i)=>{s+=x.nota*w[i];t+=w[i]});return s/t}
function nivel(p){if(p==null)return{k:'none',t:'Não iniciado'};if(p<.5)return{k:'bad',t:'Iniciante'};if(p<.7)return{k:'warn',t:'Em progresso'};if(p<.85)return{k:'good',t:'Bom'};return{k:'top',t:'Domina'}}
const corNivel={none:'var(--line)',bad:'var(--bad)',warn:'var(--warn)',good:'var(--ok)',top:'var(--top)'};
function statusRev(a){const p=a.revisao?.proxima;if(!p)return{k:'novo',t:'Não estudado'};const d=diff(hoje(),p);
  if(d<0)return{k:'atrasada',t:'Atrasada '+pl(-d,'dia','dias')};if(d===0)return{k:'hoje',t:'Revisar hoje'};if(d===1)return{k:'futuro',t:'Amanhã'};return{k:'futuro',t:'Em '+d+' dias · '+fmt(p)}}
async function registrarSessao(a,nota,extra){
  const r=a.revisao||{};const iv=proximoIntervalo(r.intervalo||0,nota);
  const hist=[...(r.historico||[]),{data:hoje(),nota:Math.round(nota*100)/100,...extra}].slice(-30);
  const rev={ultimo:hoje(),intervalo:iv,proxima:addDias(hoje(),iv),sessoes:(r.sessoes||0)+1,historico:hist};
  troca(S.ass,await upd('assuntos',a.id,{revisao:rev}));return rev}

/* ---------- banco de dados ---------- */
async function tudo(t){let out=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').order('criado_em').range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;i+=1000}}
async function carregar(){S.pronto=false;S.erro=null;render();
  try{[S.disc,S.ass,S.arq,S.qs]=await Promise.all(['disciplinas','assuntos','arquivos','questoes'].map(tudo));
    try{S.fc=await tudo('flashcards');S.fcOk=true}catch(e){console.error(e);S.fc=[];S.fcOk=false}
    ordenar();S.pronto=true}
  catch(e){S.erro='Não foi possível carregar seus dados ('+(e.message||e)+'). Confira sua internet e recarregue a página.'}
  render()}
function ordenar(){S.disc.sort((a,b)=>a.nome.localeCompare(b.nome,'pt'))}
async function ins(t,row){const{data,error}=await sb.from(t).insert(row).select().single();if(error)throw error;return data}
async function upd(t,id,patch){const{data,error}=await sb.from(t).update(patch).eq('id',id).select().single();if(error)throw error;return data}
async function del(t,id){const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error}
function troca(arr,row){const i=arr.findIndex(x=>x.id===row.id);if(i>=0)arr[i]=row;else arr.push(row);ordenar();render()}
const tira=(k,f)=>{S[k]=S[k].filter(x=>!f(x))};

const disc=id=>S.disc.find(d=>d.id===id);
const ass=id=>S.ass.find(a=>a.id===id);
const assDe=did=>S.ass.filter(a=>a.disciplina_id===did);
const qsDe=aid=>S.qs.filter(q=>q.assunto_id===aid);
const fcDe=aid=>S.fc.filter(c=>c.assunto_id===aid);
const arqDe=aid=>S.arq.filter(f=>f.assunto_id===aid);
const cor=d=>'var(--'+(d?.cor||'c8')+')';
/* cor do texto em cima de cada cor de disciplina */
const CLARAS=['c1','c4','c6','c8'];
const tinta=d=>CLARAS.includes(d?.cor||'c8')?'#5B0015':'#F7F2E0';
const flor=(c,miolo,cls)=>`<svg class="${cls||'flor'}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${c}"><circle cx="50" cy="24" r="21"/><circle cx="75" cy="42" r="21"/><circle cx="65" cy="72" r="21"/><circle cx="35" cy="72" r="21"/><circle cx="25" cy="42" r="21"/></g><circle cx="50" cy="50" r="10" fill="${miolo}"/></svg>`;

/* ---------- render ---------- */
function render(){
  document.getElementById('tabs').hidden=!S.user;
  document.getElementById('tab-hoje').setAttribute('aria-current',S.view.n==='hoje');
  document.getElementById('tab-disc').setAttribute('aria-current',!['hoje','quiz','flash'].includes(S.view.n));
  const ae=document.activeElement,fid=ae&&ae.id&&$app.contains(ae)?ae.id:null,sel=fid&&ae.selectionStart;
  $app.innerHTML=!S.user?V.login():S.erro?`<div class="banner">${esc(S.erro)}</div>`:!S.pronto?'<p class="loading">Carregando seus estudos…</p>':V[S.view.n]();
  if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(sel,sel)}catch(_){}}}
}
function go(view){S.view=view;S.confirm=null;render();window.scrollTo(0,0)}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

const V={};
V.login=()=>{const a=S.auth,criar=a.modo==='criar';
  return `<form class="auth f" data-form="auth">${flor('var(--sky)','var(--head)')}<div><span class="eyebrow">Acesso pessoal</span><h1>${criar?'Criar conta':'Entrar'}</h1></div>
  <div class="fld"><label for="f-email">E-mail</label><input type="email" id="f-email" name="email" required autocomplete="email"></div>
  <div class="fld"><label for="f-senha">Senha</label><input type="password" id="f-senha" name="senha" required minlength="6" autocomplete="${criar?'new-password':'current-password'}"></div>
  ${a.msg?`<p class="err">${esc(a.msg)}</p>`:''}${a.ok?`<p class="okmsg">${esc(a.ok)}</p>`:''}
  <button class="btn primary" type="submit">${criar?'Criar conta':'Entrar'}</button>
  <button class="btn ghost" type="button" data-act="modoAuth">${criar?'Já tenho conta':'Primeira vez? Criar conta'}</button></form>`};

V.hoje=()=>{
  const d=new Date(),t=hoje();
  const data=`${DIA[d.getDay()]}, ${d.getDate()} de ${MESL[d.getMonth()]}`;
  const h=d.getHours(),saud=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  if(!S.disc.length)return `<div class="hero"><div><span class="eyebrow">${data}</span><h1>Bem-vinda ao seu acervo</h1></div>${flor('#5B0015','#80AEE8')}</div>
   <div class="empty"><b>Nenhuma disciplina ainda.</b><span>Crie uma disciplina, adicione os assuntos e suba seus resumos. As revisões aparecem aqui conforme você estuda.</span><button class="btn primary" data-act="novaDisc">+ Criar disciplina</button></div>`;
  const devidas=S.ass.filter(a=>a.revisao?.proxima&&a.revisao.proxima<=t).sort((a,b)=>a.revisao.proxima.localeCompare(b.revisao.proxima));
  const prox=S.ass.filter(a=>a.revisao?.proxima&&a.revisao.proxima>t&&diff(t,a.revisao.proxima)<=7).sort((a,b)=>a.revisao.proxima.localeCompare(b.revisao.proxima));
  const novos=S.ass.filter(a=>!a.revisao?.proxima);
  const estudadosHoje=S.ass.filter(a=>a.revisao?.ultimo===t).length;
  const row=a=>{const dd=disc(a.disciplina_id),st=statusRev(a),n=qsDe(a.id).length,nf=fcDe(a.id).length;
    return `<button class="item" data-act="abrirAss" data-id="${a.id}"><span class="dot" style="background:${cor(dd)}"></span><span class="grow"><span class="t">${esc(a.nome)}</span><br><span class="s">${esc(dd?.nome)} · ${pl(n,'questão','questões')}${nf?' · '+nf+' flashcards':''}</span></span><span class="chip ${st.k}">${st.t}</span></button>`};
  const discProf=S.disc.map(dd=>{const ps=assDe(dd.id).map(prof).filter(p=>p!=null);return{dd,p:ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null,feitos:ps.length,tot:assDe(dd.id).length}});
  return `<div class="hero"><div><span class="eyebrow">${data}</span><h1>${saud}, Ingryd</h1>
    <div class="sum"><div><div class="big">${devidas.length}</div><div class="lbl">${devidas.length===1?'revisão para hoje':'revisões para hoje'}</div></div>
    <div><div class="big">${estudadosHoje}</div><div class="lbl">${estudadosHoje===1?'assunto estudado hoje':'assuntos estudados hoje'}</div></div></div></div>
    ${flor('#5B0015','#80AEE8')}<span class="spark" style="top:18px;right:34%">✦</span></div>
  <section class="sec"><div class="sec-head"><h2>Revisar hoje</h2></div>
    ${devidas.length?`<div class="list">${devidas.map(row).join('')}</div>`:`<div class="empty"><b>Nada pendente para hoje.</b><span>Quando você estudar um assunto e fizer as questões, a próxima revisão é marcada automaticamente.</span></div>`}</section>
  ${prox.length?`<section class="sec"><div class="sec-head"><h2>Próximos 7 dias</h2></div><div class="list">${prox.map(row).join('')}</div></section>`:''}
  ${novos.length?`<section class="sec"><div class="sec-head"><h2>Ainda não estudados</h2><span class="muted">${pl(novos.length,'assunto','assuntos')}</span></div><div class="list">${novos.slice(0,6).map(row).join('')}</div></section>`:''}
  <section class="sec"><div class="sec-head"><h2>Proficiência por disciplina</h2><span class="muted" style="font-size:.86rem">média das últimas sessões</span></div>
    <div class="list">${discProf.map(({dd,p,feitos,tot})=>{const nv=nivel(p);return `<div class="prof-row"><span class="n"><span class="dot" style="background:${cor(dd)}"></span><span>${esc(dd.nome)}</span></span>
      <div class="meter" title="${feitos} de ${tot} assuntos estudados"><span style="width:${p==null?0:Math.round(p*100)}%;background:${corNivel[nv.k]}"></span></div><span class="mono" style="text-align:right">${p==null?'—':Math.round(p*100)+'%'}</span></div>`}).join('')}</div></section>`;
};

V.disciplinas=()=>{
  const q=S.busca.trim().toLowerCase();let res='';
  if(q){const as=S.ass.filter(a=>a.nome.toLowerCase().includes(q));const qs=S.qs.filter(x=>(x.enunciado||'').toLowerCase().includes(q)).slice(0,30);
    res=`<section class="sec"><div class="sec-head"><h2>Resultados</h2><span class="muted">${pl(as.length,'assunto','assuntos')} · ${pl(qs.length,'questão','questões')}</span></div>
    ${as.length+qs.length?`<div class="list">${as.map(a=>`<button class="item" data-act="abrirAss" data-id="${a.id}"><span class="dot" style="background:${cor(disc(a.disciplina_id))}"></span><span class="grow"><span class="t">${esc(a.nome)}</span><br><span class="s">Assunto · ${esc(disc(a.disciplina_id)?.nome)}</span></span></button>`).join('')}
      ${qs.map(x=>`<button class="item" data-act="abrirAss" data-id="${x.assunto_id}"><span class="dot" style="background:${cor(disc(x.disciplina_id))}"></span><span class="grow"><span class="snip">${esc(x.enunciado)}</span><span class="s">Questão · ${esc(ass(x.assunto_id)?.nome)}</span></span></button>`).join('')}</div>`:`<p class="muted">Nada encontrado para “${esc(S.busca)}”.</p>`}</section>`}
  const cards=S.disc.map(dd=>{const as=assDe(dd.id),nq=S.qs.filter(x=>x.disciplina_id===dd.id).length,pend=as.filter(a=>a.revisao?.proxima&&a.revisao.proxima<=hoje()).length;
    const ps=as.map(prof).filter(p=>p!=null),p=ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null,nv=nivel(p);
    return `<button class="disc" data-act="abrirDisc" data-id="${dd.id}"><div class="capa" style="background:${cor(dd)};color:${tinta(dd)}">${esc(iniciais(dd.nome))}${pend?`<span class="pend">${pend} p/ revisar</span>`:''}${flor(tinta(dd),cor(dd),'mini')}</div>
      <div class="info"><span class="nm">${esc(dd.nome)}</span>
      <div class="stats"><span><b>${as.length}</b> ${as.length===1?'assunto':'assuntos'}</span><span><b>${nq}</b> ${nq===1?'questão':'questões'}</span></div>
      <div style="display:flex;align-items:center;gap:10px"><div class="meter" style="flex:1"><span style="width:${p==null?0:Math.round(p*100)}%;background:${corNivel[nv.k]}"></span></div><span class="chip ${nv.k}">${nv.t}</span></div></div></button>`}).join('');
  const usado=S.arq.reduce((s,f)=>s+(f.tamanho||0),0);
  return `<div class="title-row"><div><span class="eyebrow">Acervo</span><h1>Disciplinas</h1></div><button class="btn primary" data-act="novaDisc">+ Disciplina</button></div>
  <input class="search" id="busca" type="search" placeholder="Buscar assunto ou questão…" value="${esc(S.busca)}" autocomplete="off">
  ${res}
  ${S.disc.length?`<div class="grid-disc">${cards}</div>`:`<div class="empty"><b>Nenhuma disciplina ainda.</b><span>Exemplos: Imunologia II, Técnica Cirúrgica, Farmacologia.</span></div>`}
  <p class="hint">${pl(S.arq.length,'resumo ligado','resumos ligados')} ao seu Google Drive</p>`;
};

V.disc=()=>{
  const dd=disc(S.view.id);if(!dd)return `<p class="muted">Disciplina não encontrada.</p>`;
  const as=assDe(dd.id);
  return `<div class="crumb"><button data-act="tab" data-v="disciplinas">Disciplinas</button><span>/</span></div>
  <div class="title-row"><div style="display:flex;gap:14px;align-items:center"><span class="glyph" style="background:${cor(dd)};color:${tinta(dd)};width:56px;height:56px;font-size:1.25rem">${esc(iniciais(dd.nome))}</span><h1>${esc(dd.nome)}</h1></div>
   <div class="row-btns"><button class="btn primary" data-act="novoAss" data-id="${dd.id}">+ Assunto</button><button class="btn" data-act="editDisc" data-id="${dd.id}">Editar</button></div></div>
  ${as.length?`<div class="list">${as.map(a=>{const st=statusRev(a),nv=nivel(prof(a)),nq=qsDe(a.id).length,nf=arqDe(a.id).length;
    return `<button class="item" data-act="abrirAss" data-id="${a.id}"><span class="grow"><span class="t">${esc(a.nome)}</span><br><span class="s">${pl(nf,'resumo','resumos')} ·${pl(nq,'questão','questões')} · ${st.t}</span></span><span class="chip ${nv.k}">${nv.t}</span></button>`}).join('')}</div>`
   :`<div class="empty"><b>Nenhum assunto nesta disciplina.</b><span>Cada assunto guarda os resumos e as questões daquele tema.</span><button class="btn primary" data-act="novoAss" data-id="${dd.id}">+ Criar assunto</button></div>`}
  <div class="row-btns">${S.confirm==='disc:'+dd.id?`<span class="err">Apagar a disciplina com todos os assuntos, arquivos e questões?</span><button class="btn danger solid sm" data-act="delDisc" data-id="${dd.id}">Sim, apagar tudo</button><button class="btn sm" data-act="cancelConf">Cancelar</button>`:`<button class="btn ghost danger sm" data-act="conf" data-k="disc:${dd.id}">Excluir disciplina</button>`}</div>`;
};

/* ---------- links do Google Drive ---------- */
function lerDrive(url){url=(url||'').trim();let m;
  if(m=url.match(/\/folders\/([\w-]{10,})/))return{id:m[1],tipo:'drive-pasta'};
  if(m=url.match(/docs\.google\.com\/document\/d\/([\w-]{10,})/))return{id:m[1],tipo:'drive-doc'};
  if(m=url.match(/docs\.google\.com\/presentation\/d\/([\w-]{10,})/))return{id:m[1],tipo:'drive-slides'};
  if(m=url.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]{10,})/))return{id:m[1],tipo:'drive-planilha'};
  if(m=url.match(/\/file\/d\/([\w-]{10,})/)||url.match(/[?&]id=([\w-]{10,})/))return{id:m[1],tipo:'drive'};
  return null}
function linksDrive(f){const d=lerDrive(f.url);if(!d)return{abrir:f.url,ver:null};const id=d.id;
  return{abrir:f.url,ver:{'drive':`https://drive.google.com/file/d/${id}/preview`,'drive-doc':`https://docs.google.com/document/d/${id}/preview`,
    'drive-slides':`https://docs.google.com/presentation/d/${id}/preview`,'drive-planilha':`https://docs.google.com/spreadsheets/d/${id}/preview`,
    'drive-pasta':`https://drive.google.com/embeddedfolderview?id=${id}#list`}[d.tipo]}}
function formDrive(aid){openModal(`<h2>Ligar resumo do Drive</h2><form class="f" data-form="drive" data-a="${aid}">
  <ol class="passos"><li>No app do Google Drive, toque nos <b>três pontinhos ⋮</b> do arquivo (ou da pasta).</li><li>Toque em <b>Compartilhar</b> → <b>Copiar link</b>.</li><li>Cole o link aqui embaixo.</li></ol>
  <div class="fld"><label for="f-link">Link do Drive</label><input type="text" id="f-link" name="link" required inputmode="url" placeholder="https://drive.google.com/file/d/…"></div>
  <div class="fld"><label for="f-nomearq">Nome que vai aparecer no site</label><input type="text" id="f-nomearq" name="nome" maxlength="120" placeholder="Ex.: Resumo hipersensibilidade"></div>
  <p class="hint">Pode ser um arquivo (PDF, Word, Google Docs, slides) ou uma pasta inteira. O arquivo continua só no seu Drive.</p>
  <p class="err" id="f-err" hidden></p>
  <div class="row-btns"><button class="btn primary" type="submit">Salvar</button><button class="btn ghost" type="button" data-act="fechar">Cancelar</button></div></form>`)}
const icone=t=>t==='drive-pasta'?['PASTA','var(--c6)']:t==='drive-doc'?['DOC','var(--c5)']:t==='drive-slides'?['SLIDE','var(--c3)']:t==='drive-planilha'?['PLAN','var(--c7)']:t==='drive'?['DRIVE','var(--c1)']:t==='application/pdf'?['PDF','var(--c3)']:/^image\//.test(t)?['IMG','var(--c2)']:/word/.test(t)?['DOC','var(--c1)']:/presentation|powerpoint/.test(t)?['PPT','var(--c6)']:['ARQ','var(--c8)'];
V.ass=()=>{
  const a=ass(S.view.id);if(!a)return `<p class="muted">Assunto não encontrado.</p>`;
  const dd=disc(a.disciplina_id),qs=qsDe(a.id),st=statusRev(a),p=prof(a),nv=nivel(p),r=a.revisao||{},hist=(r.historico||[]).slice(-12);
  const fcs=fcDe(a.id),arqs=arqDe(a.id),up=S.upload&&S.upload.id===a.id?S.upload.msg:'',conf=S.confirm;
  return `<div class="crumb"><button data-act="tab" data-v="disciplinas">Disciplinas</button><span>/</span><button data-act="abrirDisc" data-id="${dd?.id}">${esc(dd?.nome)}</button><span>/</span></div>
  <div class="title-row"><div><h1>${esc(a.nome)}</h1></div><div class="row-btns"><button class="btn" data-act="editAss" data-id="${a.id}">Renomear</button></div></div>
  <section class="rev"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip ${st.k}">${st.t}</span><span class="chip ${nv.k}">${nv.t}${p!=null?' · '+Math.round(p*100)+'%':''}</span></div>
    <div class="kv"><div><span class="eyebrow">Último estudo</span><span class="v">${r.ultimo?fmt(r.ultimo):'—'}</span></div><div><span class="eyebrow">Intervalo</span><span class="v mono">${r.intervalo?'D+'+r.intervalo:'—'}</span></div><div><span class="eyebrow">Sessões</span><span class="v mono">${r.sessoes||0}</span></div></div>
    <div class="row-btns">${qs.length?`<button class="btn primary" data-act="quiz" data-id="${a.id}">Fazer questões (${Math.min(qs.length,20)})</button>`:''}${fcs.length?`<button class="btn ${qs.length?'':'primary'}" data-act="flash" data-id="${a.id}">Flashcards (${Math.min(fcs.length,30)})</button>`:''}<button class="btn ghost" data-act="autoAval" data-id="${a.id}">${qs.length||fcs.length?'Registrar só leitura':'Registrar estudo de hoje'}</button></div></div>
    ${hist.length?`<div><div class="hist" title="Resultados das últimas sessões">${hist.map(h=>`<span style="height:${Math.max(6,Math.round(h.nota*44))}px;background:${corNivel[nivel(h.nota).k]}" title="${fmt(h.data)}: ${Math.round(h.nota*100)}%"></span>`).join('')}</div><div class="hint" style="margin-top:4px">últimas sessões</div></div>`:''}
  </section>
  <section class="sec"><div class="sec-head"><h2>Resumos</h2><button class="btn sm" data-act="novoDrive" data-id="${a.id}">+ Link do Drive</button></div>
    ${arqs.length?`<div class="list">${arqs.map(f=>{const[ic,cc]=icone(f.tipo);const ehDrive=!!f.url;return `<div class="item"><span class="glyph" style="background:${cc};color:${['var(--c1)','var(--c6)'].includes(cc)?'#5B0015':'#F7F2E0'};width:44px;height:44px;font-size:.6rem;font-family:var(--f-body);font-weight:700;letter-spacing:.04em">${ic}</span>

V.quiz=()=>{
  const z=S.quiz;if(!z)return '';const a=ass(z.aid);
  if(z.fim){const r=z.res,n=z.acertos/z.ids.length,nv=nivel(n);
    return `<div class="crumb"><button data-act="abrirAss" data-id="${z.aid}">${esc(a?.nome)}</button><span>/ resultado</span></div>

    ${r?`<p>Próxima revisão em <b>${pl(r.intervalo,'dia','dias')}</b> (${fmt(r.proxima)}).</p>`:z.salvando?'<p class="muted">Salvando…</p>':'<p class="err">Não foi possível salvar o resultado. Confira a internet e refaça a sessão.</p>'}
    <div class="row-btns"><button class="btn primary" data-act="abrirAss" data-id="${z.aid}">Voltar ao assunto</button><button class="btn" data-act="tab" data-v="hoje">Ir para Hoje</button></div></div>`}

   <span class="eyebrow">${esc(a?.nome)}${q.fonte?' · '+esc(q.fonte):''}</span>
   <p class="enun">${esc(q.enunciado)}</p>
   <div class="alts">${q.alternativas.map((t,i)=>{let c='';if(resp){if(i===q.correta)c='certa';else if(i===z.escolha)c='errada'}
     return `<button class="alt ${c}" data-act="resp" data-i="${i}" ${resp?'disabled':''}><span class="L">${LET[i]}</span><span class="x">${esc(t)}</span></button>`}).join('')}</div>
   ${resp?`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Correta!':'Incorreta — gabarito: '+LET[q.correta]}</b>${q.comentario?`<p style="white-space:pre-wrap">${esc(q.comentario)}</p>`:''}</div>

function closeModal(){$modal.hidden=true;$modal.innerHTML='';pdfToken++}
$modal.addEventListener('click',e=>{if(e.target===$modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$modal.hidden)closeModal()});

  <div class="fld"><label for="f-nome">Nome do assunto</label><input type="text" id="f-nome" name="nome" required maxlength="120" value="${esc(a?.nome||'')}" placeholder="Ex.: Hipersensibilidade tipo I"></div>
  <div class="row-btns"><button class="btn primary" type="submit">Salvar</button><button class="btn" type="button" data-act="fechar">Cancelar</button></div></form>`)}
function formQ(q,aid){const alts=q?.alternativas||[];

  <div class="fld"><span class="lb">Alternativas <span class="hint">— marque a correta</span></span>
   ${[0,1,2,3,4].map(i=>`<div class="altin"><label class="rad"><input type="radio" name="correta" value="${i}" ${(q?q.correta===i:i===0)?'checked':''} aria-label="Alternativa ${LET[i]} correta">${LET[i]}</label><input type="text" id="f-alt${i}" name="alt${i}" value="${esc(alts[i]||'')}" placeholder="${i<2?'Obrigatória':'Opcional'}"></div>`).join('')}</div>

function formF(c,aid){openModal(`<h2>${c?'Editar flashcard':'Novo flashcard'}</h2><form class="f" data-form="f" data-id="${c?.id||''}" data-a="${aid}">

  <div class="fld"><label for="f-verso">Verso (resposta)</label><textarea id="f-verso" name="verso" required rows="4" placeholder="Ex.: IgE, ligada ao FcεRI de mastócitos e basófilos.">${esc(c?.verso||'')}</textarea></div>
  <div class="row-btns"><button class="btn primary" type="submit">Salvar</button>${c?'':'<button class="btn" type="submit" name="mais" value="1">Salvar e criar outro</button>'}<button class="btn ghost" type="button" data-act="fechar">Cancelar</button></div></form>`)}
function formImport(aid){openModal(`<h2>Importar flashcards e questões</h2><form class="f" data-form="imp" data-a="${aid}">
  <p class="muted">Cole aqui o texto que o Claude te enviou. Para flashcards rápidos, você também pode escrever um por linha no formato <b>pergunta | resposta</b>.</p>
  <div class="fld"><label for="f-imp">Texto para importar</label><textarea id="f-imp" name="txt" required rows="10" placeholder="Qual o tratamento de 1ª linha da anafilaxia? | Adrenalina IM na coxa"></textarea></div>
  <p class="err" id="f-err" hidden></p>
  <div class="row-btns"><button class="btn primary" type="submit">Importar</button><button class="btn ghost" type="button" data-act="fechar">Cancelar</button></div></form>`)}
function lerImport(txt){txt=txt.trim();const fc=[],qs=[];
  if(txt.startsWith('[')||txt.startsWith('{')){let arr=JSON.parse(txt);if(!Array.isArray(arr))arr=arr.itens||[arr];
    for(const x of arr){
      if(x.frente&&x.verso)fc.push({frente:String(x.frente).trim(),verso:String(x.verso).trim()});
      else if(x.enunciado&&Array.isArray(x.alternativas)&&x.alternativas.length>=2){
        let c=x.correta;if(typeof c==='string')c=LET.indexOf(c.trim().toUpperCase());
        if(c>=0&&c<x.alternativas.length)qs.push({enunciado:String(x.enunciado).trim(),alternativas:x.alternativas.map(String),correta:c,comentario:x.comentario||'',fonte:x.fonte||''})}}}
  else for(const l of txt.split('\n')){const i=l.indexOf('|');if(i>0){const f=l.slice(0,i).trim(),v=l.slice(i+1).trim();if(f&&v)fc.push({frente:f,verso:v})}}
  return{fc,qs}}
function autoAval(a){openModal(`<h2>Como foi o estudo de hoje?</h2><p class="muted">${esc(a.nome)} — a próxima revisão é marcada pela sua resposta.</p>
  <div class="rate">${[['0.4','Difícil','Quase nada ficou'],['0.65','Razoável','Entendi parte'],['0.8','Bem','Entendi a maior parte'],['0.95','Fácil','Domino o assunto']].map(([v,t,s])=>`<button data-act="rate" data-id="${a.id}" data-v="${v}"><b>${t}</b><span class="hint">${s}</span></button>`).join('')}</div>
  <button class="btn" data-act="fechar">Cancelar</button>`)}

/* ---------- visualizador de arquivos ---------- */
let pdfToken=0,pdfLib=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function getPdfJs(){if(pdfLib)return pdfLib;const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScript(b+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.js';pdfLib=window.pdfjsLib;return pdfLib}
async function ver(f){
  if(f.url){const l=linksDrive(f);
    openModal(`<div class="title-row"><h2 style="min-width:0;overflow-wrap:anywhere">${esc(f.nome)}</h2><div class="row-btns"><a class="btn sm primary" href="${esc(l.abrir)}" target="_blank" rel="noopener">Abrir no Drive</a><button class="btn sm" data-act="fechar">Fechar</button></div></div>
    ${l.ver?`<div class="viewer drive"><iframe src="${esc(l.ver)}" title="${esc(f.nome)}" allow="autoplay" loading="lazy"></iframe></div><p class="hint">Se aparecer “sem acesso” ou ficar em branco, toque em <b>Abrir no Drive</b>. O arquivo abre no app do Google Drive.</p>`
      :`<div class="viewer"><p class="muted" style="padding:20px;text-align:center">Toque em <b>Abrir no Drive</b> para ver este resumo.</p></div>`}`,true);
    return}
  const tk=++pdfToken;
  openModal(`<div class="title-row"><h2 style="min-width:0;overflow-wrap:anywhere">${esc(f.nome)}</h2><div class="row-btns" id="v-btns"><button class="btn sm" data-act="fechar">Fechar</button></div></div><div class="viewer" id="viewer"><p class="muted">Carregando…</p></div>`,true);
  const v=document.getElementById('viewer'),btns=document.getElementById('v-btns');
  const[{data:s1,error:e1},{data:s2}]=await Promise.all([sb.storage.from(BUCKET).createSignedUrl(f.caminho,3600),sb.storage.from(BUCKET).createSignedUrl(f.caminho,3600,{download:f.nome})]);
  if(tk!==pdfToken)return;
  if(e1){v.innerHTML=`<p class="err">Não foi possível abrir o arquivo (${esc(e1.message)}).</p>`;return}
  btns.insertAdjacentHTML('afterbegin',`<a class="btn sm" href="${s1.signedUrl}" target="_blank" rel="noopener">Nova aba</a>${s2?`<a class="btn sm" href="${s2.signedUrl}">Baixar</a>`:''}`);
  if(/^image\//.test(f.tipo)){v.innerHTML=`<img src="${s1.signedUrl}" alt="${esc(f.nome)}">`;return}
  if(f.tipo!=='application/pdf'){v.innerHTML=`<p class="muted" style="padding:20px;text-align:center">Arquivos de Word e PowerPoint não abrem dentro do site.<br>Use “Baixar” ou “Nova aba” para abrir no aplicativo do seu aparelho.</p>`;return}
  try{const lib=await getPdfJs();const pdf=await lib.getDocument(s1.signedUrl).promise;if(tk!==pdfToken)return;v.innerHTML='';
    const w=Math.min(v.clientWidth-24,900),dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=pdf.numPages;i++){if(tk!==pdfToken)return;const pg=await pdf.getPage(i);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:w/vp0.width*dpr});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+'px';v.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
  }catch(e){if(tk===pdfToken)v.innerHTML=`<p class="muted">Não deu para mostrar o PDF aqui. Use “Nova aba”.</p>`}
}

/* ---------- ações ---------- */
const falhou=e=>{console.error(e);toast('Não foi possível salvar. Confira a internet e tente de novo.')};
const A={
  tab:d=>go({n:d.v}),
  abrirDisc:d=>go({n:'disc',id:d.id}),
  abrirAss:d=>go({n:'ass',id:d.id}),
  novaDisc:()=>formDisc(),
  editDisc:d=>formDisc(disc(d.id)),
  novoAss:d=>formAss(null,d.id),
  editAss:d=>formAss(ass(d.id)),
  novaQ:d=>formQ(null,d.id),
  editQ:d=>{const q=S.qs.find(x=>x.id===d.id);formQ(q,q.assunto_id)},
  fechar:()=>closeModal(),
  conf:d=>{S.confirm=d.k;render()},
  cancelConf:()=>{S.confirm=null;render()},
  ver:d=>ver(S.arq.find(f=>f.id===d.id)),
  autoAval:d=>autoAval(ass(d.id)),
  modoAuth:()=>{S.auth={modo:S.auth.modo==='criar'?'entrar':'criar',msg:null,ok:null};render()},
  sair:async()=>{await sb.auth.signOut()},
  rate:async d=>{closeModal();try{const r=await registrarSessao(ass(d.id),+d.v,{tipo:'auto'});toast('Próxima revisão em '+pl(r.intervalo,'dia','dias'))}catch(e){falhou(e)}},
  quiz:d=>{const qs=qsDe(d.id).map(q=>({q,k:(q.tentativas?q.acertos/q.tentativas:-1)+Math.random()*.15})).sort((x,y)=>x.k-y.k).slice(0,20).map(x=>x.q.id);
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
    S.quiz={aid:d.id,ids:qs,i:0,escolha:null,acertos:0,fim:false};go({n:'quiz'})},
  resp:d=>{const z=S.quiz;if(z.escolha!=null)return;const q=S.qs.find(x=>x.id===z.ids[z.i]);const i=+d.i;z.escolha=i;const ok=i===q.correta;if(ok)z.acertos++;render();
    document.getElementById('btn-prox')?.scrollIntoView({block:'nearest',behavior:'smooth'});
    upd('questoes',q.id,{tentativas:(q.tentativas||0)+1,acertos:(q.acertos||0)+(ok?1:0),ultima:hoje()}).then(row=>{const k=S.qs.findIndex(x=>x.id===row.id);if(k>=0)S.qs[k]=row}).catch(console.error)},
  prox:async()=>{const z=S.quiz;z.i++;z.escolha=null;
    if(z.i>=z.ids.length){z.fim=true;z.salvando=true;render();window.scrollTo(0,0);
      try{z.res=await registrarSessao(ass(z.aid),z.acertos/z.ids.length,{tipo:'questoes',acertos:z.acertos,total:z.ids.length})}catch(e){console.error(e);z.res=null}
      z.salvando=false}
    render();window.scrollTo(0,0)},
  sairQuiz:()=>{const id=S.quiz.aid;S.quiz=null;go({n:'ass',id})},
  novaF:d=>formF(null,d.id),
  editF:d=>{const c=S.fc.find(x=>x.id===d.id);formF(c,c.assunto_id)},
  delF:async d=>{S.confirm=null;try{await del('flashcards',d.id);tira('fc',x=>x.id===d.id);render();toast('Flashcard apagado')}catch(e){falhou(e)}},
  importar:d=>formImport(d.id),
  flash:d=>{const ids=fcDe(d.id).map(c=>({c,k:(c.tentativas?c.acertos/c.tentativas:-1)+Math.random()*.2})).sort((x,y)=>x.k-y.k).slice(0,30).map(x=>x.c.id);
    for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
    S.flash={aid:d.id,ids,i:0,virado:false,acertos:0,fim:false};go({n:'flash'})},
  virar:()=>{const z=S.flash;if(!z||z.virado)return;z.virado=true;render();document.getElementById('btn-fc1')?.scrollIntoView({block:'nearest',behavior:'smooth'})},
  fcResp:async d=>{const z=S.flash,c=S.fc.find(x=>x.id===z.ids[z.i]),ok=d.v==='1';
    if(c){if(ok)z.acertos++;upd('flashcards',c.id,{tentativas:(c.tentativas||0)+1,acertos:(c.acertos||0)+(ok?1:0),ultima:hoje()}).then(row=>{const k=S.fc.findIndex(x=>x.id===row.id);if(k>=0)S.fc[k]=row}).catch(console.error)}
    z.i++;z.virado=false;
    if(z.i>=z.ids.length){z.fim=true;z.salvando=true;render();window.scrollTo(0,0);
      try{z.res=await registrarSessao(ass(z.aid),z.acertos/z.ids.length,{tipo:'flashcards',acertos:z.acertos,total:z.ids.length})}catch(e){console.error(e);z.res=null}
      z.salvando=false}
    render()},
  sairFlash:()=>{const id=S.flash.aid;S.flash=null;go({n:'ass',id})},
  delQ:async d=>{S.confirm=null;try{await del('questoes',d.id);tira('qs',x=>x.id===d.id);render();toast('Questão apagada')}catch(e){falhou(e)}},
  delArq:async d=>{S.confirm=null;const f=S.arq.find(x=>x.id===d.id);try{await apagarArquivos([f]);await del('arquivos',f.id);tira('arq',x=>x.id===f.id);render();toast(f.url?'Link removido do site':'Arquivo apagado')}catch(e){falhou(e)}},
  novoDrive:d=>formDrive(d.id),
  delAss:async d=>{const a=ass(d.id);try{await apagarArquivos(arqDe(a.id));await del('assuntos',a.id);limparAss([a.id]);go({n:'disc',id:a.disciplina_id});toast('Assunto apagado')}catch(e){falhou(e)}},
  delDisc:async d=>{const as=assDe(d.id);try{await apagarArquivos(S.arq.filter(f=>as.some(a=>a.id===f.assunto_id)));await del('disciplinas',d.id);limparAss(as.map(a=>a.id));tira('disc',x=>x.id===d.id);go({n:'disciplinas'});toast('Disciplina apagada')}catch(e){falhou(e)}},
};
async function apagarArquivos(fs){fs=fs.filter(f=>f.caminho);if(fs.length&&sb){const{error}=await sb.storage.from(BUCKET).remove(fs.map(f=>f.caminho));if(error)throw error}}
function limparAss(ids){tira('ass',x=>ids.includes(x.id));tira('fc',x=>ids.includes(x.assunto_id));tira('qs',x=>ids.includes(x.assunto_id));tira('arq',x=>ids.includes(x.assunto_id))}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}});
document.addEventListener('input',e=>{if(e.target.id==='busca'){S.busca=e.target.value;render()}});
document.addEventListener('change',async e=>{const aid=e.target.dataset?.up;if(!aid)return;const files=[...e.target.files];e.target.value='';await enviar(aid,files)});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fd=new FormData(f),k=f.dataset.form,id=f.dataset.id;
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  try{
    if(k==='auth'){const email=fd.get('email').trim(),password=fd.get('senha');
      const{error,data}=S.auth.modo==='criar'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
      if(error){S.auth.msg=traduz(error.message);S.auth.ok=null;render();return}
      if(S.auth.modo==='criar'&&!data.session){S.auth={modo:'entrar',msg:null,ok:'Conta criada! Abra o e-mail de confirmação que o Supabase enviou, clique no link e depois entre aqui.'};render()}
      return}
    if(k==='disc'){const body={nome:fd.get('nome').trim(),cor:fd.get('cor')};
      if(id)troca(S.disc,await upd('disciplinas',id,body));else{const r=await ins('disciplinas',body);troca(S.disc,r);closeModal();go({n:'disc',id:r.id});return}}
    if(k==='ass'){const nome=fd.get('nome').trim();
      if(id)troca(S.ass,await upd('assuntos',id,{nome}));else{const r=await ins('assuntos',{nome,disciplina_id:f.dataset.d});troca(S.ass,r);closeModal();go({n:'ass',id:r.id});return}}
    if(k==='drive'){const err=f.querySelector('#f-err'),link=fd.get('link').trim(),dv=lerDrive(link);
      if(!dv){err.textContent='Esse não parece um link do Google Drive. No Drive, use Compartilhar → Copiar link e cole aqui.';err.hidden=false;btn.disabled=false;return}
      const nome=fd.get('nome').trim()||({'drive-pasta':'Pasta do Drive','drive-doc':'Documento do Drive','drive-slides':'Slides do Drive','drive-planilha':'Planilha do Drive'}[dv.tipo]||'Resumo do Drive');
      troca(S.arq,await ins('arquivos',{assunto_id:f.dataset.a,nome,tipo:dv.tipo,url:link,tamanho:0}));toast('Resumo ligado')}
    if(k==='f'){const a=ass(f.dataset.a),body={frente:fd.get('frente').trim(),verso:fd.get('verso').trim(),assunto_id:a.id,disciplina_id:a.disciplina_id};
      troca(S.fc,id?await upd('flashcards',id,body):await ins('flashcards',body));toast('Flashcard salvo');
      if(e.submitter?.name==='mais'){formF(null,a.id);return}}
    if(k==='imp'){const err=f.querySelector('#f-err'),a=ass(f.dataset.a);let r;
      try{r=lerImport(fd.get('txt'))}catch(_){err.textContent='Não consegui ler esse texto. Copie de novo a mensagem inteira que o Claude enviou.';err.hidden=false;btn.disabled=false;return}
      if(!r.fc.length&&!r.qs.length){err.textContent='Nenhum flashcard ou questão encontrado. Para flashcards, use uma linha por cartão: pergunta | resposta';err.hidden=false;btn.disabled=false;return}
      if(r.fc.length&&!S.fcOk){err.textContent='Ative os flashcards no Supabase antes de importar.';err.hidden=false;btn.disabled=false;return}
      const base={assunto_id:a.id,disciplina_id:a.disciplina_id};
      if(r.fc.length){const rows=r.fc.map(x=>({...x,...base}));
        if(window.ESTUDOS_DEMO){for(const x of rows)S.fc.push(await ins('flashcards',x))}else{const{data,error}=await sb.from('flashcards').insert(rows).select();if(error)throw error;S.fc.push(...data)}}
      if(r.qs.length){const rows=r.qs.map(x=>({...x,...base}));
        if(window.ESTUDOS_DEMO){for(const x of rows)S.qs.push(await ins('questoes',x))}else{const{data,error}=await sb.from('questoes').insert(rows).select();if(error)throw error;S.qs.push(...data)}}
      closeModal();render();toast('Importados: '+[r.fc.length?pl(r.fc.length,'flashcard','flashcards'):'',r.qs.length?pl(r.qs.length,'questão','questões'):''].filter(Boolean).join(' e '));return}
    if(k==='q'){const alts=[0,1,2,3,4].map(i=>(fd.get('alt'+i)||'').trim());const correta=+fd.get('correta');
      const keep=alts.map((t,i)=>({t,i})).filter(x=>x.t);const err=f.querySelector('#f-err');
      if(keep.length<2){err.textContent='Preencha pelo menos duas alternativas.';err.hidden=false;btn.disabled=false;return}
      if(!alts[correta]){err.textContent='A alternativa marcada como correta está vazia.';err.hidden=false;btn.disabled=false;return}
      const a=ass(f.dataset.a);const body={enunciado:fd.get('enun').trim(),alternativas:keep.map(x=>x.t),correta:keep.findIndex(x=>x.i===correta),comentario:fd.get('com').trim(),fonte:fd.get('fonte').trim(),assunto_id:a.id,disciplina_id:a.disciplina_id};
      troca(S.qs,id?await upd('questoes',id,body):await ins('questoes',body));toast('Questão salva')}
    closeModal();
  }catch(err){btn.disabled=false;falhou(err)}finally{if(k==='auth')btn.disabled=false}
});
function traduz(m){if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';if(/not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).';if(/already registered/i.test(m))return 'Esse e-mail já tem conta. Use “Já tenho conta”.';if(/Signups not allowed/i.test(m))return 'Cadastro de novas contas desativado.';if(/at least/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';return m}

const TIPOS={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',heic:'image/heic',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',
  pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',ppt:'application/vnd.ms-powerpoint'};
async function enviar(aid,files){
  const ruins=[];let enviados=0;
  const usado=()=>S.arq.reduce((s,f)=>s+(f.tamanho||0),0);
  for(let i=0;i<files.length;i++){const f=files[i],ext=(f.name.split('.').pop()||'').toLowerCase(),tipo=TIPOS[ext]||f.type;
    if(!tipo){ruins.push(f.name+' (tipo não aceito)');continue}
    if(f.size>LIMITE_ARQUIVO){ruins.push(f.name+' (maior que 50 MB)');continue}
    if(usado()+f.size>LIMITE_ARMAZENAMENTO){ruins.push(f.name+' (armazenamento cheio)');continue}
    S.upload={id:aid,msg:`Enviando ${i+1} de ${files.length}: ${f.name}…`};render();
    const limpo=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_');
    const caminho=`${S.user.id}/${aid}/${Date.now()}-${limpo}`;
    try{const{error}=await sb.storage.from(BUCKET).upload(caminho,f,{contentType:tipo});if(error)throw error;
      troca(S.arq,await ins('arquivos',{assunto_id:aid,nome:f.name,tipo,tamanho:f.size,caminho}));enviados++}
    catch(e){console.error(e);ruins.push(f.name)}}
  S.upload=ruins.length?{id:aid,msg:'Não enviados: '+ruins.join(', ')+'.'}:null;render();
  if(enviados)toast(pl(enviados,'arquivo enviado','arquivos enviados'));
}

/* ---------- início ---------- */
function definirUsuario(u){const novo=u?.id||null,velho=S.user?.id||null;if(novo===velho)return;S.user=u;
  if(u){S.view={n:'hoje'};carregar()}else{Object.assign(S,{disc:[],ass:[],arq:[],qs:[],fc:[],pronto:false,quiz:null,flash:null,auth:{modo:'entrar',msg:null,ok:null}});render()}}
if(window.ESTUDOS_DEMO){ /* modo prévia: dados de exemplo, nada é salvo */
  const k={disciplinas:'disc',assuntos:'ass',arquivos:'arq',questoes:'qs',flashcards:'fc'};
  ins=async(t,row)=>({id:'x'+Math.random().toString(36).slice(2),criado_em:new Date().toISOString(),tentativas:0,acertos:0,revisao:{},...row});
  upd=async(t,id,patch)=>({...S[k[t]].find(x=>x.id===id),...patch});
  del=async()=>{};
  Object.assign(S,window.ESTUDOS_DEMO,{user:{id:'demo'},pronto:true});ordenar();render();
}else{
  sb.auth.getSession().then(({data})=>{if(data.session)definirUsuario(data.session.user);else render()});
  sb.auth.onAuthStateChange((_ev,session)=>{setTimeout(()=>definirUsuario(session?.user||null),0)});
}
</script>
